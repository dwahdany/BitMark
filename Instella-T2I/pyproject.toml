[project]
name = "bitmark-instella"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "transformers>=4.53.1",
    "diffusers>=0.20.0",
    "safetensors>=0.3.0",
    "accelerate>=0.20.0",
    "pillow>=9.0.0",
    "numpy>=1.21.0",
    "scipy>=1.10.0",
    "mmengine>=0.7.0",
    "tqdm>=4.64.0",
    "bitsandbytes>=0.41.0",
    "wandb>=0.15.0",
    "einops>=0.8.1",
    "flash-attn>=2.8.3",
]

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
