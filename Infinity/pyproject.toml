[project]
name = "bitmark-infinity"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "accelerate>=1.4.0",
    "diffusers>=0.33.0",
    "transformers>=4.37.0",
    "safetensors>=0.5.0",
    "einops>=0.8.0",
    "omegaconf>=2.3.0",
    "timm",
    "pillow>=10.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.60.0",
    "huggingface-hub>=0.20.0",
    "opencv-python>=4.8.0",
    "fire>=0.5.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "numpy<2.0",
    "pandas>=2.0.0",
    "flash-attn>=2.8.3",
    "imageio>=2.37.2",
]
[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]
[tool.uv]
index-url = "https://download.pytorch.org/whl/cu121"
extra-index-url = ["https://pypi.org/simple"]
